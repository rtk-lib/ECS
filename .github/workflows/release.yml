name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Validate on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  package:
    name: Package headers
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "rtk_ecs/include"
          cp -R include/* "rtk_ecs/include/"

          if [ -f README.md ]; then
            cp README.md "rtk_ecs/"
          fi

          if [ -f LICENSE ]; then
            cp LICENSE "rtk_ecs/"
          fi

          # On crée les archives avec le nom de ton tag (ex: rtk_ecs-v1.0.1.zip)
          cmake -E tar cf "rtk_ecs-${TAG}.zip" --format=zip "rtk_ecs"
          cmake -E tar czf "rtk_ecs-${TAG}.tar.gz" "rtk_ecs"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtk-ecs-${{ github.event.release.tag_name }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            *.zip \
            *.tar.gz \
            --clobber